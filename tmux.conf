# 把前缀键从 C-b 改成 C-a（更容易按，且和 screen 一致）
#set -g prefix C-a
#unbind C-b
#bind C-a send-prefix

# 窗口、窗格编号从 1 开始（键盘上 1 到 0 更顺手）
#set -g base-index 1
#setw -g pane-base-index 1

# 用 | 和 - 分屏，比 % 和 " 直观
bind | split-window -h
bind - split-window -v

# 支持鼠标：点击切窗格、滚轮翻历史
set -g mouse on

# 加大回滚缓冲（默认 2000 行）
set -g history-limit 10000

# 按 r 重载配置
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
